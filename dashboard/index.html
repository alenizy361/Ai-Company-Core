<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rabit AI Company OS</title>
<style>
  :root{
    --bg:#070b16; --card:#0a0f1f; --card2:#0d1326; --line:#1b2340;
    --text:#e8ecff; --dim:#8b93c4;
    --cyan:#38e1ff; --violet:#b18cff; --green:#4ade80; --amber:#fbbf24;
    --red:#fb7185; --blue:#60a5fa; --gray:#64748b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);overflow-x:hidden;
    font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
    padding-bottom:calc(130px + env(safe-area-inset-bottom,0px));
  }
  /* ============ header ============ */
  header{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
    padding:12px 14px;background:rgba(7,11,22,.86);backdrop-filter:blur(14px);
  }
  .hbtn{
    width:44px;height:44px;border-radius:14px;border:1px solid var(--line);
    background:var(--card);color:var(--text);display:grid;place-items:center;
    font-size:18px;cursor:pointer;flex:none
  }
  header h1{font-size:16px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
  .spacer{flex:1}
  .seg{
    display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;
    background:var(--card);padding:3px;flex:none
  }
  .seg button{
    border:0;background:transparent;color:var(--dim);font-weight:800;font-size:12px;
    padding:8px 14px;border-radius:999px;cursor:pointer
  }
  .seg button.on{background:#22c55e;color:#032012}
  /* ============ board card ============ */
  .board{
    margin:10px 12px;background:linear-gradient(180deg,#0a0f22,#080c1a);
    border:1px solid var(--line);border-radius:24px;overflow:hidden;position:relative;
  }
  #stage{position:relative;width:100%;aspect-ratio:10/11.5;min-height:440px;max-height:76vh}
  #space{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* agent nodes */
  .agent{
    position:absolute;transform:translate(-50%,-50%);z-index:5;
    display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;user-select:none
  }
  .agent:active{transform:translate(-50%,-50%) scale(.93)}
  .bubble{
    width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
    font-weight:800;font-size:13px;letter-spacing:.5px;color:var(--tc,var(--text));
    background:radial-gradient(circle at 34% 30%,#141c3a,#070b19 78%);
    border:2.5px solid var(--rc,var(--gray));
    box-shadow:0 0 18px color-mix(in srgb,var(--rc,var(--gray)) 55%,transparent),
               inset 0 0 14px rgba(0,0,0,.65);
    animation:floaty 5s ease-in-out infinite;
  }
  .agent.big .bubble{width:64px;height:64px;font-size:14px}
  .agent.working .bubble{
    animation:pulse 1.1s ease-in-out infinite,floaty 4.5s ease-in-out infinite;
    box-shadow:0 0 30px color-mix(in srgb,var(--rc) 90%,transparent),inset 0 0 14px rgba(0,0,0,.6);
  }
  .agent.talking .bubble{
    animation:talkring .8s ease-in-out infinite,floaty 4.5s ease-in-out infinite;
  }
  @keyframes pulse{50%{box-shadow:0 0 44px color-mix(in srgb,var(--rc) 100%,transparent)}}
  @keyframes talkring{
    0%,100%{box-shadow:0 0 22px color-mix(in srgb,var(--rc) 80%,transparent),0 0 0 0 rgba(255,255,255,.5)}
    50%{box-shadow:0 0 34px color-mix(in srgb,var(--rc) 100%,transparent),0 0 0 9px rgba(255,255,255,0)}
  }
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .chip{
    font-size:10px;font-weight:800;letter-spacing:.4px;padding:3px 10px;border-radius:999px;
    background:rgba(74,222,128,.13);color:var(--green);border:1px solid rgba(74,222,128,.35);
    white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis
  }
  .chip.amber{background:rgba(251,191,36,.13);color:var(--amber);border-color:rgba(251,191,36,.4)}
  .chip.violet{background:rgba(177,140,255,.13);color:var(--violet);border-color:rgba(177,140,255,.4)}
  .chip.hide{display:none}
  .caption{text-align:center;color:var(--dim);font-size:12px;padding:12px 16px 16px}
  #modeBadge{position:absolute;top:12px;inset-inline-start:14px;z-index:6;
    font-size:9px;padding:4px 10px;border-radius:999px;font-weight:800;letter-spacing:1.5px}
  #modeBadge.live{background:rgba(74,222,128,.15);color:var(--green);border:1px solid rgba(74,222,128,.4)}
  #modeBadge.demo{background:rgba(251,113,133,.12);color:var(--red);border:1px solid rgba(251,113,133,.4)}
  html[dir="rtl"] #sendBtn svg{transform:scaleX(-1)}
  /* ============ live feed ============ */
  .panel{
    margin:14px 12px;background:var(--card);border:1px solid var(--line);
    border-radius:20px;overflow:hidden
  }
  .phead{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .phead b{font-size:12px;letter-spacing:2.5px;color:var(--dim);font-weight:800}
  .reddot{width:8px;height:8px;border-radius:50%;background:var(--violet)}
  @keyframes blink{50%{opacity:.2}}
  #feedBox{max-height:300px;min-height:140px;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px;
    background:#070a16}
  .fline{display:flex;align-items:flex-start;gap:8px;direction:ltr;text-align:left}
  .abadge{
    flex:none;min-width:36px;text-align:center;font-size:9px;font-weight:800;letter-spacing:.5px;
    padding:3px 6px;border-radius:7px;color:var(--c,#9aa4d6);
    border:1px solid color-mix(in srgb,var(--c,#9aa4d6) 45%,transparent);
    background:color-mix(in srgb,var(--c,#9aa4d6) 10%,transparent);margin-top:2px
  }
  .ftext{font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.7;color:#b7c1ff;word-break:break-word}
  .ftext .tool{color:var(--amber);font-weight:700}
  .ftext .ok{color:var(--green);font-weight:700}
  .ftext .say{color:#e8ecff;font-style:italic}
  .cursor{display:inline-block;width:7px;height:12px;background:var(--cyan);vertical-align:-2px;animation:blink .7s infinite}
  /* ============ status section ============ */
  .secTitle{margin:18px 16px 8px;font-size:13px;font-weight:800;letter-spacing:3px;color:var(--dim)}
  .srow{
    display:flex;align-items:center;justify-content:space-between;
    margin:0 12px 8px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:14px 16px;font-size:14px
  }
  .srow b{color:var(--violet);font-weight:800}
  .srow .g{color:var(--green)} .srow .a{color:var(--amber)}
  /* ============ drawer ============ */
  #ov{position:fixed;inset:0;background:rgba(3,4,10,.6);backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:.25s}
  #ov.open{opacity:1;pointer-events:auto}
  #drawer{
    position:fixed;z-index:41;inset-inline:0;bottom:0;max-height:75vh;overflow:auto;
    background:var(--card2);border-top:1px solid var(--line);border-radius:22px 22px 0 0;
    transform:translateY(105%);transition:.3s cubic-bezier(.2,.8,.2,1);
    padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));
  }
  #drawer.open{transform:none}
  .grab{width:44px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
  .dhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .dhead .bubble{width:48px;height:48px;font-size:12px;animation:none}
  #dTitle{font-size:16px;font-weight:800}
  #dRole{font-size:11px;color:var(--dim)}
  .livebadge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:var(--violet)}
  .livebadge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--violet)}
  #dStream{display:flex;flex-direction:column;gap:6px;margin-top:12px}
  #dStream .fline{background:#070a16;border:1px solid var(--line);border-radius:10px;padding:7px 9px}
  #dEmpty{color:var(--dim);font-size:12px;text-align:center;padding:18px 0}
  /* ============ chat dock ============ */
  #dock{
    position:fixed;z-index:35;inset-inline:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));
    background:rgba(10,15,31,.94);backdrop-filter:blur(16px);
    border:1px solid var(--line);border-radius:20px;padding:10px;
  }
  #msgs{max-height:34vh;overflow:auto;display:none;flex-direction:column;gap:8px;padding:4px 2px 10px}
  #msgs.open{display:flex}
  .msg{max-width:84%;padding:9px 13px;border-radius:16px;font-size:13px;line-height:1.55}
  .msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--cyan),#0ea5c9);color:#04121a;border-end-end-radius:4px;font-weight:600}
  .msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-end-start-radius:4px}
  html[dir="rtl"] .msg.me{align-self:flex-start}
  html[dir="rtl"] .msg.ai{align-self:flex-end}
  #dockRow{display:flex;gap:8px;align-items:center}
  #inp{flex:1;background:#070a16;border:1px solid var(--line);border-radius:14px;
    color:var(--text);padding:12px 14px;font-size:14px;outline:none;min-width:0}
  #inp:focus{border-color:var(--cyan)}
  .rbtn{width:46px;height:46px;flex:none;border-radius:14px;border:1px solid var(--line);
    background:var(--card);color:var(--text);font-size:18px;cursor:pointer;display:grid;place-items:center}
  .rbtn.primary{background:var(--cyan);color:#04121a;border-color:var(--cyan)}
  .rbtn.mic.on{background:var(--red);border-color:var(--red);color:#fff;animation:blink 1.2s infinite}
  .rbtn.spk.off{opacity:.4}
  .rbtn:disabled{opacity:.35}
  #voiceNote{font-size:10px;color:var(--dim);text-align:center;padding-top:6px;display:none}
  /* ============ order card + lock ============ */
  .orderCard{align-self:stretch;background:#0a1330;border:1px solid rgba(56,225,255,.35);
    border-radius:16px;padding:12px 14px;margin:2px 0}
  .orderCard .ot{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--cyan);margin-bottom:4px}
  .orderCard .odesc{font-size:13px;color:var(--text);margin-bottom:10px;line-height:1.5}
  .orderCard button{width:100%;border:0;border-radius:12px;padding:11px;font-size:14px;font-weight:800;
    background:linear-gradient(135deg,var(--cyan),#0ea5c9);color:#04121a;cursor:pointer}
  .orderCard button:disabled{opacity:.5}
  .orderCard a.open{display:block;text-align:center;margin-top:8px;color:var(--cyan);font-weight:700;
    text-decoration:none;font-size:14px}
  #lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
  #lock.show{display:flex}
  #lock h2{font-size:20px;font-weight:800}
  #lock p{color:var(--dim);font-size:13px}
  #lockInp{width:100%;max-width:320px;text-align:center;background:#070a16;border:1px solid var(--line);
    border-radius:14px;color:var(--text);padding:14px;font-size:16px;letter-spacing:2px;outline:none}
  #lockInp:focus{border-color:var(--cyan)}
  #lockBtn{width:100%;max-width:320px;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:800;
    background:var(--cyan);color:#04121a;cursor:pointer}
  #lockErr{color:var(--red);font-size:13px;height:16px}
</style>
</head>
<body>

<header>
  <button class="hbtn">☰</button>
  <h1>Rabit AI Company OS</h1>
  <div class="spacer"></div>
  <div class="seg">
    <button id="btnAR" class="on">AR</button>
    <button id="btnEN">EN</button>
  </div>
</header>

<div class="board">
  <span id="modeBadge" class="demo">DEMO</span>
  <div id="stage"><canvas id="space"></canvas><div id="nodes"></div></div>
  <div class="caption" data-i18n="caption">اضغط على أي موظف لتشاهد بثّه المباشر</div>
</div>

<div class="panel">
  <div class="phead"><span class="reddot"></span><b data-i18n="liveFeed">LIVE STREAM</b><div class="spacer"></div><b id="feedCount" style="letter-spacing:0">0</b></div>
  <div id="feedBox"></div>
</div>

<div class="secTitle" data-i18n="coreStatus">حالة النواة</div>
<div class="srow"><span data-i18n="central">النواة المركزية</span><b id="coreState">—</b></div>
<div class="srow"><span data-i18n="agents">الموظفون</span><span class="g" id="stAgents">11</span></div>
<div class="srow"><span data-i18n="working">يعملون الآن</span><span class="a" id="stWorking">0</span></div>

<div id="ov"></div>
<div id="drawer">
  <div class="grab"></div>
  <div class="dhead">
    <div class="bubble" id="dBubble">?</div>
    <div>
      <div id="dTitle">—</div>
      <div id="dRole">—</div>
    </div>
    <div class="spacer"></div>
    <span class="livebadge" id="dLive" data-i18n="simTag">SIM</span>
  </div>
  <span class="chip" id="dTask">—</span>
  <div id="dStream"></div>
  <div id="dEmpty" data-i18n="dEmpty">لا يوجد نشاط بعد — أرسل أمرًا للشركة</div>
</div>

<div id="lock">
  <h2 data-i18n="lockTitle">رمز الدخول</h2>
  <p data-i18n="lockHint">أدخل رمز الدخول الخاص بك</p>
  <input id="lockInp" type="password" inputmode="text" autocomplete="off" autocapitalize="off">
  <div id="lockErr"></div>
  <button id="lockBtn" data-i18n="lockBtn">دخول</button>
</div>

<div id="dock">
  <div id="msgs"></div>
  <div id="dockRow">
    <button class="rbtn mic" id="micBtn" title="voice"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/></svg></button>
    <button class="rbtn spk" id="spkBtn" title="sound"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
    <input id="inp" data-i18n-ph="ask" placeholder="مُر شركتك… مثلاً: سوّوا لي متجر إلكتروني" autocomplete="off">
    <button class="rbtn primary" id="sendBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20v-6l8-2-8-2V4l19 8z"/></svg></button>
  </div>
  <div id="voiceNote" data-i18n="voiceNote">الصوت يتطلب فتح الموقع عبر https</div>
</div>

<script>
/* ================================================================
   Rabit AI Company OS — interactive neural command center
   - voice in (SpeechRecognition) + voice out (speechSynthesis queue)
   - command engine: core analyzes an order, assigns a team,
     agents light up, stream their work live and ping each other
   ================================================================ */

/* ================= i18n ================= */
const I18N={
  ar:{caption:"اضغط على أي موظف لعرض نشاطه — محاكاة بصرية",liveFeed:"محاكاة النشاط",simTag:"محاكاة",
      coreStatus:"حالة النواة",central:"النواة المركزية",
      agents:"الموظفون",working:"يعملون الآن",
      ask:"مُر شركتك… مثلاً: سوّوا لي متجر إلكتروني",
      voiceNote:"الصوت يتطلب فتح الموقع عبر https",
      listening:"أستمع إليك…",dEmpty:"لا يوجد نشاط بعد — أرسل أمرًا للشركة",
      stIdle:"جاهزة",stPlan:"تخطط",stExec:"تنفّذ",
      chipWork:"يعمل…",chipDone:"تم",chipTalk:"يتكلم",
      thinking:"النواة تفكر…",
      offBadge:"غير متصل",
      offline:"النواة غير متصلة بالخادم. تأكد أن خدمة rabit-brain شغالة على السيرفر ثم حدّث الصفحة.",
      task:"المهمة الحالية",noTask:"لا يوجد مشروع نشط",
      lockTitle:"رمز الدخول",lockHint:"أدخل رمز الدخول الخاص بك",lockBtn:"دخول",lockErr:"رمز غير صحيح",
      execConfirm:"تنفيذ فعلي",execTitle:"خطة عمل جاهزة للتنفيذ الحقيقي",
      execRunning:"الفريق يشتغل فعلياً على الخادم…",execWait:"كل موظف ينفّذ مهمته الحقيقية بالترتيب — قد يستغرق دقائق.",
      execDone:"خلص الفريق فعلياً. النتيجة جاهزة:",execOpen:"افتح النتيجة",
      execFail:"تعذّر إتمام العمل:",execSent:"أرسلت الخطة للتنفيذ الحقيقي — تابع الفريق على اللوحة.",
      chipRun:"يشتغل…",chipWait:"بالانتظار",chipDoneF:"تم",chipFail:"فشل",
      stStarted:"بدأ العمل",stWrote:"أنتج",stFailed:"فشل",
      planIntro:"الخطة — سينفّذ هؤلاء الموظفون بالترتيب على الخادم:"},
  en:{caption:"Tap any agent to view its activity — visual simulation",liveFeed:"ACTIVITY SIMULATION",simTag:"SIM",
      coreStatus:"AI CORE STATUS",central:"Central core",
      agents:"Agents",working:"Working now",
      ask:"Command your company… e.g. build me an online store",
      voiceNote:"Voice requires opening the site over https",
      listening:"Listening…",dEmpty:"No activity yet — send your company a command",
      stIdle:"Online",stPlan:"Planning",stExec:"Executing",
      chipWork:"working…",chipDone:"done",chipTalk:"talking",
      thinking:"Core is thinking…",
      offBadge:"OFFLINE",
      offline:"The core is not connected to the server. Make sure the rabit-brain service is running, then refresh the page.",
      task:"Current project",noTask:"No active project",
      lockTitle:"Access code",lockHint:"Enter your access code",lockBtn:"Enter",lockErr:"Wrong code",
      execConfirm:"Run for real",execTitle:"Work plan ready for real execution",
      execRunning:"The team is really working on the server…",execWait:"Each agent runs its real task in order — this can take a few minutes.",
      execDone:"The team finished for real. Result is ready:",execOpen:"Open result",
      execFail:"The work could not complete:",execSent:"Plan sent for real execution — watch the team on the board.",
      chipRun:"working…",chipWait:"waiting",chipDoneF:"done",chipFail:"failed",
      stStarted:"started",stWrote:"produced",stFailed:"failed",
      planIntro:"Plan — these agents will run in order on the server:"}
};
let lang="ar";
function T(k){return I18N[lang][k];}
function applyLang(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  btnAR.classList.toggle("on",lang==="ar");btnEN.classList.toggle("on",lang==="en");
  document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.dataset.i18n;if(I18N[lang][k])el.textContent=I18N[lang][k];});
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{const k=el.dataset.i18nPh;if(I18N[lang][k])el.placeholder=I18N[lang][k];});
  if(!LIVE)modeBadge.textContent=T("offBadge");
  setCore(coreMode);
  AGENTS.forEach(updateNode);
}
btnAR.onclick=()=>{lang="ar";applyLang();};
btnEN.onclick=()=>{lang="en";applyLang();};

/* ================= roster ================= */
/* pos = % of stage. Agents light up ONLY when their real step is running. */
const AGENTS=[
  {key:"CEO",x:50,y:7.5, ring:"#34d399",tc:"#b18cff",big:1,ar:"الرئيس التنفيذي",en:"CEO"},
  {key:"PM", x:31,y:90, ring:"#fbbf24",tc:"#60a5fa",ar:"مدير المشاريع",en:"Project Manager"},
  {key:"FE", x:24,y:14, ring:"#38e1ff",tc:"#38e1ff",ar:"مهندس الواجهات",en:"Frontend"},
  {key:"QA", x:75,y:15.5,ring:"#34d399",tc:"#38e1ff",ar:"مراقب الجودة",en:"QA"},
  {key:"BE", x:15,y:33, ring:"#38e1ff",tc:"#38e1ff",ar:"مهندس الأنظمة",en:"Backend"},
  {key:"SEC",x:85,y:37.5,ring:"#fb7185",tc:"#fb7185",ar:"مسؤول الأمن",en:"Security"},
  {key:"DB", x:14,y:55, ring:"#38e1ff",tc:"#38e1ff",ar:"مهندس البيانات",en:"Database"},
  {key:"AN", x:85,y:58, ring:"#34d399",tc:"#34d399",ar:"محلل البيانات",en:"Analytics"},
  {key:"UX", x:17,y:74, ring:"#60a5fa",tc:"#60a5fa",ar:"مصمم التجربة",en:"UX Designer"},
  {key:"MKT",x:83,y:76, ring:"#34d399",tc:"#34d399",ar:"مدير التسويق",en:"Marketing"},
  {key:"FIN",x:69,y:91, ring:"#fbbf24",tc:"#fbbf24",ar:"المدير المالي",en:"Finance"},
];
const byKey=Object.fromEntries(AGENTS.map(a=>[a.key,a]));

/* ================= live probe ================= */
/* LIVE = a real Claude brain answers /api/chat (see server/rabit-brain.py);
   otherwise the page runs its built-in demo engine */
if(!("timeout" in AbortSignal)){ /* older Safari/WebView */
  AbortSignal.timeout=ms=>{const c=new AbortController();setTimeout(()=>c.abort(),ms);return c.signal;};
}
let LIVE=false,HEALTH={};

/* ================= canvas ================= */
const cv=document.getElementById("space"),ctx=cv.getContext("2d");
let W,H,CX,CY,R,stars=[],mesh=[],interLinks=[];
let voiceAmp=0,speakAmp=0,t=0,boltSeed=0;
function resize(){
  W=cv.width=stage.clientWidth*devicePixelRatio;
  H=cv.height=stage.clientHeight*devicePixelRatio;
  cv.style.width=stage.clientWidth+"px";cv.style.height=stage.clientHeight+"px";
  CX=W/2;CY=H*0.465;R=Math.min(W*0.30,H*0.24);
  stars=[];for(let i=0;i<110;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3*devicePixelRatio,tw:Math.random()*7});
  mesh=[];for(let i=0;i<56;i++){const th=Math.acos(2*Math.random()-1),ph=Math.random()*Math.PI*2;mesh.push({th,ph});}
}
function nodePx(a){return{x:a.x/100*W,y:a.y/100*H};}
/* jagged electric bolt */
function bolt(x1,y1,x2,y2,color,seed){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1,steps=Math.max(5,Math.floor(len/(34*devicePixelRatio)));
  const nx=-dy/len,ny=dx/len;
  let px=x1,py=y1;
  ctx.strokeStyle=color;ctx.shadowColor=color;ctx.shadowBlur=14*devicePixelRatio;
  ctx.lineCap="round";
  for(let i=1;i<=steps;i++){
    const u=i/steps;
    const wob=(i===steps?0:(Math.sin(seed*13.7+i*97.3)*0.5+Math.sin(seed*7.1+i*31.7)*0.5))*len*0.09;
    const x=x1+dx*u+nx*wob, y=y1+dy*u+ny*wob;
    ctx.lineWidth=(2.8-1.8*u+Math.sin(seed+i)*0.5)*devicePixelRatio;
    ctx.globalAlpha=0.55+0.35*Math.sin(seed*3+i);
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(x,y);ctx.stroke();
    if(i%2===0&&Math.sin(seed*5+i*2.3)>0.55){
      ctx.globalAlpha=0.5;ctx.fillStyle=color;
      ctx.beginPath();ctx.arc(x,y,(3.2+Math.sin(seed+i)*1.5)*devicePixelRatio,0,7);ctx.fill();
    }
    px=x;py=y;
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
}
function draw(){
  t+=0.008;if((t*60|0)%5===0)boltSeed=Math.random()*1000;
  ctx.clearRect(0,0,W,H);
  /* stars */
  for(const s of stars){s.tw+=0.02;ctx.globalAlpha=0.25+0.3*Math.sin(s.tw);ctx.fillStyle="#9fb4ff";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  const amp=1+Math.sin(t*2)*0.025+voiceAmp*0.4+speakAmp*0.2;
  const r=R*amp;
  /* bolts to active agents (behind core) */
  for(const a of AGENTS){
    const active=a.status==="working"||a.status==="talking";
    const p=nodePx(a);
    if(active){
      const ang=Math.atan2(p.y-CY,p.x-CX);
      bolt(CX+Math.cos(ang)*r*1.05,CY+Math.sin(ang)*r*1.0,p.x,p.y,a.ring,boltSeed+a.x);
    }else{
      ctx.strokeStyle=a.ring;ctx.globalAlpha=0.13;ctx.lineWidth=1*devicePixelRatio;
      ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.globalAlpha=1;
    }
  }
  /* agent-to-agent link bolts */
  interLinks=interLinks.filter(l=>(l.ttl-=0.016)>0);
  for(const l of interLinks){
    const p1=nodePx(l.a),p2=nodePx(l.b);
    bolt(p1.x,p1.y,p2.x,p2.y,l.color,boltSeed+l.a.x+l.b.y);
  }
  /* platform ellipses under core */
  ctx.strokeStyle="rgba(56,225,255,0.35)";
  for(let i=0;i<3;i++){
    ctx.globalAlpha=0.35-i*0.1;ctx.lineWidth=(2-i*0.5)*devicePixelRatio;
    ctx.beginPath();ctx.ellipse(CX,CY+r*1.55,r*(0.85-i*0.16),r*(0.22-i*0.045),0,0,7);ctx.stroke();
  }
  ctx.globalAlpha=1;
  /* nebula core */
  let g=ctx.createRadialGradient(CX,CY,0,CX,CY,r*1.9);
  g.addColorStop(0,"rgba(216,180,254,0.55)");
  g.addColorStop(0.35,"rgba(168,85,247,0.35)");
  g.addColorStop(0.62,"rgba(56,225,255,0.14)");
  g.addColorStop(1,"transparent");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(CX,CY,r*1.9,0,7);ctx.fill();
  g=ctx.createRadialGradient(CX-r*0.3,CY-r*0.25,0,CX,CY,r);
  g.addColorStop(0,"rgba(244,214,255,0.85)");
  g.addColorStop(0.45,"rgba(147,90,235,0.55)");
  g.addColorStop(0.8,"rgba(23,37,84,0.9)");
  g.addColorStop(1,"rgba(10,15,35,0.95)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(CX,CY,r,0,7);ctx.fill();
  /* mesh inside sphere */
  const proj=[];
  for(const p of mesh){
    const ph=p.ph+t;
    const x3=Math.sin(p.th)*Math.cos(ph),y3=Math.cos(p.th),z3=Math.sin(p.th)*Math.sin(ph);
    proj.push({x:CX+x3*r*0.92,y:CY+y3*r*0.86,z:z3});
  }
  ctx.strokeStyle="rgba(200,215,255,0.5)";ctx.lineWidth=0.8*devicePixelRatio;
  for(let i=0;i<proj.length;i++)for(let j=i+1;j<proj.length;j++){
    const a=proj[i],b=proj[j],dx=a.x-b.x,dy=a.y-b.y;
    if(dx*dx+dy*dy<r*r*0.30){ctx.globalAlpha=0.07+0.13*((a.z+b.z)/2+1)/2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  }
  ctx.globalAlpha=1;
  for(const p of proj){if(p.z>-0.2){ctx.fillStyle="#e7efff";ctx.globalAlpha=0.35+p.z*0.45;ctx.beginPath();ctx.arc(p.x,p.y,1.6*devicePixelRatio,0,7);ctx.fill();}}
  ctx.globalAlpha=1;
  /* sphere ring */
  ctx.strokeStyle="rgba(56,225,255,0.6)";ctx.lineWidth=1.6*devicePixelRatio;
  ctx.beginPath();ctx.arc(CX,CY,r,0,7);ctx.stroke();
  /* labels */
  ctx.textAlign="center";
  ctx.fillStyle="#ffffff";ctx.shadowColor="rgba(255,255,255,.8)";ctx.shadowBlur=14*devicePixelRatio;
  ctx.font=`800 ${r*0.30}px -apple-system,Segoe UI,Arial`;
  ctx.fillText("RABIT",CX,CY-r*0.02);
  ctx.shadowBlur=0;
  ctx.fillStyle="#dfe7ff";ctx.font=`700 ${r*0.125}px -apple-system,Segoe UI,Arial`;
  ctx.fillText("A I   C O R E",CX,CY+r*0.20);
  ctx.fillStyle="rgba(200,212,255,0.75)";ctx.font=`600 ${r*0.075}px -apple-system,Segoe UI,Arial`;
  ctx.fillText("• N E U R A L   C O M M A N D   C E N T E R •",CX,CY+r*0.38);
  voiceAmp*=0.94;speakAmp*=0.90;
  requestAnimationFrame(draw);
}

/* ================= live feed (streaming lines) ================= */
const feedBox=document.getElementById("feedBox");
let feedN=0;
function colorize(txt){
  return txt
    .replace(/^(▶ \S+)/,'<span class="tool">$1</span>')
    .replace(/^(✔ .*)$/,'<span class="ok">$1</span>');
}
function feed(a,text,opts={}){
  feedN++;feedCount.textContent=feedN;
  const line=document.createElement("div");line.className="fline";
  line.innerHTML=`<span class="abadge" style="--c:${a.ring}">${a.key}</span><span class="ftext"></span>`;
  const span=line.querySelector(".ftext");
  const stick=feedBox.scrollHeight-feedBox.scrollTop-feedBox.clientHeight<60;
  feedBox.appendChild(line);
  while(feedBox.children.length>45)feedBox.firstChild.remove();
  if(stick)feedBox.scrollTop=feedBox.scrollHeight;
  /* typewriter stream */
  let i=0;
  const cur=document.createElement("span");cur.className="cursor";span.after(cur);
  const type=()=>{
    if(i<text.length){
      span.textContent=text.slice(0,++i);
      if(stick)feedBox.scrollTop=feedBox.scrollHeight;
      setTimeout(type,10+Math.random()*22);
    }else{
      cur.remove();
      span.innerHTML=opts.quote?`<span class="say">“${text}”</span>`:colorize(text);
      pushToBuf(a,line.innerHTML);
    }
  };
  type();
}
function pushToBuf(a,html){
  a.buf.push(html);if(a.buf.length>30)a.buf.shift();
  if(openAgent===a){
    const l=document.createElement("div");l.className="fline";l.innerHTML=html;
    dStream.appendChild(l);
    while(dStream.children.length>30)dStream.firstChild.remove();
    dEmpty.style.display="none";
    dStream.scrollTop=dStream.scrollHeight;
  }
}

/* ================= voice out (queued, per-agent pitch) ================= */
let voiceOn=true,speakingNow=false;
const ttsQ=[];
spkBtn.onclick=()=>{
  voiceOn=!voiceOn;spkBtn.classList.toggle("off",!voiceOn);
  if(!voiceOn){ttsQ.length=0;try{speechSynthesis.cancel();}catch(e){}}
};
function say(txt,agent){
  if(!voiceOn)return;
  ttsQ.push({txt,agent});pumpTTS();
}
async function pumpTTS(){
  if(speakingNow||!ttsQ.length)return;
  speakingNow=true;
  const {txt,agent}=ttsQ.shift();
  let prev=null;
  if(agent&&agent.status!=="working"){prev=agent.status;agent.status="talking";updateNode(agent);refreshStats();}
  const iv=setInterval(()=>{speakAmp=0.55+Math.random()*0.45;},120);
  const done=()=>{
    clearInterval(iv);
    if(agent&&agent.status==="talking"){agent.status=prev==="done"?"done":prev||"idle";updateNode(agent);refreshStats();}
    speakingNow=false;setTimeout(pumpTTS,220);
  };
  /* prefer a natural neural voice from the server; fall back to browser TTS */
  if(LIVE&&HEALTH.tts&&HEALTH.tts!=="browser"){
    try{
      const r=await authFetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({text:txt,lang:/[؀-ۿ]/.test(txt)?"ar":"en"}),signal:AbortSignal.timeout(20000)});
      if(r.ok&&(r.headers.get("Content-Type")||"").includes("audio")){
        const url=URL.createObjectURL(await r.blob());
        const au=new Audio(url);au.onended=()=>{URL.revokeObjectURL(url);done();};
        au.onerror=()=>{URL.revokeObjectURL(url);browserSay(txt,agent,done);};
        au.play().catch(()=>browserSay(txt,agent,done));return;
      }
    }catch(e){}
  }
  browserSay(txt,agent,done);
}
function browserSay(txt,agent,done){
  if(!("speechSynthesis" in window)){done();return;}
  const u=new SpeechSynthesisUtterance(txt);
  u.lang=/[؀-ۿ]/.test(txt)?"ar-SA":"en-US";
  u.rate=1.04;u.pitch=agent?agent.pitch:1;
  u.onend=done;u.onerror=done;
  try{speechSynthesis.speak(u);}catch(e){done();}
}

/* ================= real project engine ================= */
/* Everything here is driven by the REAL backend project status
   (GET /api/project). An agent lights up only while its real step is
   running; every feed line reflects a real event (step started / files
   produced / failed). No canned output, no random activity. */
let activeProject=null;   /* {id, agents:[...], seen:{}} */
function wakeBoard(){}     /* no fake ambient activity — board is calm when idle */

function resetBoard(){
  AGENTS.forEach(a=>{a.status="idle";updateNode(a);});
  refreshStats();
}

/* start a real project from a plan the brain produced */
async function startProject(plan,title){
  const agents=plan.map(s=>s.agent);
  resetBoard();
  /* mark all planned agents as waiting so the owner sees the crew */
  agents.forEach(k=>{if(byKey[k]){byKey[k].status="wait";updateNode(byKey[k]);}});
  setCore("planning");
  try{
    const r=await authFetch("/api/confirm",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({title,plan}),signal:AbortSignal.timeout(20000)});
    if(r.status===401){TOKEN="";localStorage.removeItem("rabit_token");showLock();return null;}
    const j=await r.json();
    if(!j.project_id){addMsg(T("execFail")+" "+(j.error||""),false);resetBoard();setCore("idle");return null;}
    addMsg(T("execSent"),false);
    activeProject={id:j.project_id,agents,seen:{}};
    setCore("executing");
    pollProject();
    return j.project_id;
  }catch(e){addMsg(T("execFail")+" "+e,false);resetBoard();setCore("idle");return null;}
}

/* poll the REAL project status and reflect each real step transition */
async function pollProject(){
  if(!activeProject)return;
  const p=activeProject;
  let proj;
  try{
    const r=await authFetch("/api/project?id="+encodeURIComponent(p.id),{signal:AbortSignal.timeout(15000)});
    if(r.status===401){TOKEN="";localStorage.removeItem("rabit_token");showLock();activeProject=null;return;}
    proj=await r.json();
  }catch(e){setTimeout(pollProject,4000);return;}
  if(!proj||!proj.steps){setTimeout(pollProject,4000);return;}

  proj.steps.forEach((s,i)=>{
    const a=byKey[s.agent];if(!a)return;
    const key=i+":"+s.status;
    /* board state from the REAL step status */
    if(s.status==="running"&&a.status!=="working"){a.status="working";updateNode(a);refreshStats();}
    if(s.status==="done"&&a.status!=="done"){a.status="done";updateNode(a);refreshStats();}
    if(s.status==="failed"&&a.status!=="fail"){a.status="fail";updateNode(a);refreshStats();}
    /* one REAL feed line per new transition */
    if(!p.seen[key]){
      p.seen[key]=1;
      if(s.status==="running"){
        feed(a,"▶ "+(s.title||a.key)+" — "+T("stStarted"));
        /* real handoff bolt from the previous agent */
        const prev=proj.steps[i-1];if(prev&&byKey[prev.agent])interLinks.push({a:byKey[prev.agent],b:a,ttl:2.4,color:a.ring});
      }else if(s.status==="done"){
        const files=(s.files||"").split(",").filter(Boolean);
        feed(a,"✔ "+T("stWrote")+": "+(files.length?files.join(", "):"—"));
      }else if(s.status==="failed"){
        feed(a,"✕ "+T("stFailed")+(s.error?": "+s.error.slice(0,60):""));
      }
    }
  });

  if(proj.status==="done"||proj.status==="failed"){
    activeProject=null;setCore("idle");
    if(proj.status==="done"){
      projectDone(proj);
    }else{
      addMsg(T("execFail")+" "+(proj.error||""),false);say(T("execFail"));
    }
    return;
  }
  setTimeout(pollProject,3000);
}

function projectDone(proj){
  addMsg(T("execDone"),false);say(T("execDone"));
  const card=document.createElement("div");card.className="msg ai orderCard";
  card.innerHTML=`<div class="ot">${T("execDone")}</div>`;
  const a=document.createElement("a");a.className="open";
  a.href=proj.url||("/deliverables/"+proj.id+"/");a.target="_blank";a.textContent=T("execOpen");
  card.appendChild(a);
  msgs.appendChild(card);msgs.scrollTop=msgs.scrollHeight;
}

/* stable per-browser session id so the brain keeps conversation memory */
let SID=localStorage.getItem("rabit_sid");
if(!SID){SID=Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  try{localStorage.setItem("rabit_sid",SID);}catch(e){}}

function addTyping(){
  msgs.classList.add("open");
  const el=document.createElement("div");el.className="msg ai";
  el.textContent=T("thinking");
  msgs.appendChild(el);msgs.scrollTop=msgs.scrollHeight;

  const rm=el.remove.bind(el);el.remove=()=>{clearInterval(iv);rm();};
  return el;
}

/* LIVE mode: the real Claude brain answers, and may return a REAL work plan
   (ordered steps) the owner can confirm to execute for real on the server */
async function askBrain(v){
  const th=addTyping();
  if(!activeProject)setCore("planning");
  try{
    const r=await authFetch("/api/chat",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:v,lang,session:SID}),
      signal:AbortSignal.timeout(240000)});
    if(r.status===401){th.remove();TOKEN="";localStorage.removeItem("rabit_token");showLock();return;}
    const j=await r.json().catch(()=>null);
    if(!r.ok){
      if(j&&j.reply){th.remove();addMsg(j.reply,false);say(j.reply);
        if(!activeProject)setCore("idle");return;}
      throw 0;
    }
    if(!j)throw 0;
    th.remove();
    const reply=(j.reply||"").trim();
    const plan=Array.isArray(j.plan)?j.plan.filter(s=>s&&byKey[s.agent]):null;
    if(!reply&&!(plan&&plan.length))throw 0;
    if(reply){addMsg(reply,false);say(reply);}
    if(plan&&plan.length){
      if(activeProject)addMsg(T("execRunning"),false);   /* one real project at a time */
      else planCard(plan,reply||v);
    }else if(!activeProject)setCore("idle");
  }catch(e){
    th.remove();
    addMsg(T("offline"),false);
    if(!activeProject)setCore("idle");
  }
}

/* show the REAL plan the brain produced; on confirm, run it for real and let
   the board reflect the actual step-by-step execution (startProject) */
function planCard(plan,title){
  msgs.classList.add("open");
  const card=document.createElement("div");card.className="msg ai orderCard";
  card.innerHTML=`<div class="ot">${T("execTitle")}</div>`;
  const intro=document.createElement("div");intro.className="odesc";intro.textContent=T("planIntro");
  card.appendChild(intro);
  plan.forEach((s,i)=>{
    const a=byKey[s.agent];
    const row=document.createElement("div");row.className="odesc";
    row.textContent=(i+1)+". "+a.key+" — "+((s.title||"")).slice(0,120);
    card.appendChild(row);
  });
  const btn=document.createElement("button");btn.textContent=T("execConfirm");
  card.appendChild(btn);
  btn.onclick=async()=>{
    btn.disabled=true;
    const pid=await startProject(plan,(title||"").slice(0,160));
    if(!pid){btn.disabled=false;return;}
    card.querySelector(".ot").textContent=T("execRunning");
    btn.remove();
  };
  msgs.appendChild(card);msgs.scrollTop=msgs.scrollHeight;
}

function send(){
  const v=inp.value.trim();if(!v)return;
  inp.value="";addMsg(v,true);
  if(!LIVE){addMsg(T("offline"),false);return;}
  askBrain(v);
}
sendBtn.onclick=send;
inp.addEventListener("keydown",e=>{if(e.key==="Enter")send();});

/* ================= voice in ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recOn=false,audioCtx=null;
if(!window.isSecureContext||!SR){micBtn.disabled=true;voiceNote.style.display="block";}
micBtn.onclick=async()=>{
  if(recOn){try{rec.stop();}catch(e){}return;}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(stream),an=audioCtx.createAnalyser();
    an.fftSize=256;src.connect(an);const buf=new Uint8Array(an.frequencyBinCount);
    const loop=()=>{if(!recOn)return;an.getByteFrequencyData(buf);
      voiceAmp=Math.min(1,(buf.reduce((s,x)=>s+x,0)/buf.length)/70);requestAnimationFrame(loop);};
    rec=new SR();rec.lang=lang==="ar"?"ar-SA":"en-US";rec.interimResults=true;
    recOn=true;micBtn.classList.add("on");inp.placeholder=T("listening");loop();
    rec.onresult=e=>{let s="";for(const r of e.results)s+=r[0].transcript;inp.value=s;};
    rec.onend=()=>{recOn=false;micBtn.classList.remove("on");
      stream.getTracks().forEach(tr=>tr.stop());applyLang();
      if(inp.value.trim())send();};
    rec.onerror=()=>{recOn=false;micBtn.classList.remove("on");applyLang();};
    rec.start();
  }catch(e){voiceNote.style.display="block";}
};

/* ================= boot ================= */
buildNodes();applyLang();resize();draw();probeLive();refreshStats();
setInterval(()=>{if(!LIVE)probeLive();},30000); /* keep trying if the brain comes up later */
</script>
</body>
