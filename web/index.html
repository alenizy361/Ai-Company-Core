<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060913">
<meta name="description" content="SIRA — voice-first autonomous company operating system">
<link rel="manifest" href="/manifest.json">
<title>SIRA</title>
<style>
  /* Critical boot styles only — full styling in css/*. Body hidden until the
     boot script applies the persisted language/direction (no flash). */
  html { background: #060913; }
  body { visibility: hidden; }
  body.booted { visibility: visible; }
</style>
<script>
  // Pre-paint locale application: persisted choice, default English/LTR.
  (function () {
    var lang = 'en';
    try { lang = localStorage.getItem('sira.lang') || 'en'; } catch (e) {}
    if (lang !== 'ar') lang = 'en';
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  })();
</script>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/network.css">
<link rel="stylesheet" href="/css/motion.css">
</head>
<body>
<div id="banner" role="status"></div>
<header id="header"><!-- rendered by ui/shell.js --></header>

<main id="stage">
  <canvas id="core" aria-hidden="true"></canvas>
  <svg id="network" role="group"></svg>
  <span id="micDot" aria-hidden="true"></span>
  <span id="syncWarn" hidden></span>
  <div id="centerText">
    <span id="voiceState" role="status"></span>
    <div id="transcriptLine"><bdi dir="auto"></bdi></div>
    <div id="replyLine" class="prose-stream" tabindex="0"></div>
    <div id="execLine"></div>
  </div>
</main>

<div id="cards" role="region"><!-- ranked context cards --></div>

<nav id="controls"><!-- rendered by ui/shell.js --></nav>

<div class="ov" id="chatOv"></div>
<aside class="drawer" id="chatDrawer" role="dialog" aria-modal="true"><!-- ui/chat.js --></aside>

<div class="ov" id="actOv"></div>
<aside class="drawer" id="actDrawer" role="dialog" aria-modal="true"><!-- ui/activity.js --></aside>

<div class="ov" id="inspectorOv"></div>
<aside id="inspector" role="dialog" aria-modal="true"><!-- ui/inspector.js --></aside>

<div class="ov" id="paletteOv"></div>
<div id="palette" role="dialog" aria-modal="true"><!-- ui/palette.js --></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
