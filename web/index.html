<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<link rel="manifest" href="/manifest.json">
<title>RABIT</title>
<style>
  :root{
    --bg:#070b16; --card:#0a0f1f; --card2:#0d1326; --line:#1b2340;
    --text:#e8ecff; --dim:#8b93c4;
    --cyan:#38e1ff; --violet:#b18cff; --green:#4ade80; --amber:#fbbf24; --red:#fb7185; --gray:#64748b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);overflow:hidden;
    font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;z-index:5}
  header h1{font-size:16px;font-weight:800;letter-spacing:.5px}
  .spacer{flex:1}
  .badge{font-size:9px;font-weight:800;letter-spacing:1.2px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
  .badge.live{background:rgba(74,222,128,.12);color:var(--green);border-color:rgba(74,222,128,.4)}
  .badge.off{background:rgba(251,113,133,.12);color:var(--red);border-color:rgba(251,113,133,.4)}
  .badge.warn{background:rgba(251,191,36,.12);color:var(--amber);border-color:rgba(251,191,36,.4)}
  .badge.dim{color:var(--dim)}
  /* center stage */
  #stage{position:relative;flex:1;min-height:0}
  #orb{position:absolute;inset:0;width:100%;height:100%}
  #centerText{position:absolute;inset-inline:0;bottom:8%;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 20px;pointer-events:none;text-align:center}
  #voiceState{font-size:10px;font-weight:800;letter-spacing:2.5px;color:var(--dim);text-transform:uppercase}
  #transcriptLine{font-size:15px;min-height:22px;color:var(--text);max-width:640px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #replyLine{font-size:13px;min-height:20px;color:var(--dim);max-width:640px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #execLine{font-size:11px;color:var(--cyan);min-height:16px}
  /* bottom controls */
  #controls{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:5}
  .cbtn{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    color:var(--text);font-size:20px;cursor:pointer;display:grid;place-items:center;position:relative}
  .cbtn:disabled{opacity:.35}
  .cbtn .cnt{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--amber);color:#1a1200;font-size:10px;font-weight:800;
    min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
  .cbtn .cnt[hidden]{display:none}
  #talkBtn{width:72px;height:72px;font-size:28px;background:radial-gradient(circle at 35% 30%,#1b2a55,#0a0f22);border-color:var(--cyan)}
  #talkBtn.muted{border-color:var(--red);opacity:.6}
  #micDot{position:absolute;top:10px;inset-inline-end:10px;width:8px;height:8px;border-radius:50%;background:var(--gray)}
  #micDot.on{background:var(--red);box-shadow:0 0 8px var(--red)}
  /* drawers */
  .ov{position:fixed;inset:0;background:rgba(3,4,10,.6);backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:.25s}
  .ov.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;z-index:41;inset-inline:0;bottom:0;max-height:82vh;overflow:auto;background:var(--card2);
    border-top:1px solid var(--line);border-radius:22px 22px 0 0;transform:translateY(105%);
    transition:.3s cubic-bezier(.2,.8,.2,1);padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px))}
  .drawer.open{transform:none}
  .grab{width:44px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
  .drawer h2{font-size:13px;font-weight:800;letter-spacing:2px;color:var(--dim);margin:14px 0 8px}
  .drawer h2:first-of-type{margin-top:0}
  /* chat */
  #chatMsgs{display:flex;flex-direction:column;gap:8px;min-height:120px;max-height:46vh;overflow:auto;padding:4px 2px}
  .msg{max-width:84%;padding:9px 13px;border-radius:16px;font-size:13px;line-height:1.5;white-space:pre-wrap}
  .msg.me{align-self:flex-start;background:linear-gradient(135deg,var(--cyan),#0ea5c9);color:#04121a;font-weight:600}
  .msg.ai{align-self:flex-end;background:var(--card);border:1px solid var(--line)}
  html[dir="ltr"] .msg.me{align-self:flex-end}
  html[dir="ltr"] .msg.ai{align-self:flex-start}
  .msg .tech{font-size:10px;color:var(--dim);margin-top:4px}
  #chatRow{display:flex;gap:8px;margin-top:10px}
  #chatInp{flex:1;background:#070a16;border:1px solid var(--line);border-radius:14px;color:var(--text);padding:12px 14px;font-size:14px;outline:none;min-width:0}
  #chatInp:focus{border-color:var(--cyan)}
  .sbtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer}
  .sbtn.primary{background:var(--cyan);color:#04121a;border-color:var(--cyan)}
  .sbtn.danger{background:transparent;color:var(--red);border-color:rgba(251,113,133,.5)}
  .sbtn.ok{background:transparent;color:var(--green);border-color:rgba(74,222,128,.5)}
  /* activity cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px;font-size:13px}
  .card .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card .grow{flex:1;min-width:120px}
  .card small{color:var(--dim);font-size:11px;display:block;margin-top:3px;word-break:break-word}
  .chip{font-size:9px;font-weight:800;letter-spacing:.6px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .chip.running,.chip.verifying{color:var(--cyan);border-color:rgba(56,225,255,.4)}
  .chip.queued,.chip.waiting_for_dependency,.chip.waiting_for_tool,.chip.waiting_for_approval,.chip.blocked{color:var(--amber);border-color:rgba(251,191,36,.4)}
  .chip.completed,.chip.idle{color:var(--green);border-color:rgba(74,222,128,.4)}
  .chip.failed,.chip.cancelled,.chip.offline{color:var(--red);border-color:rgba(251,113,133,.4)}
  .empty{color:var(--dim);font-size:12px;padding:6px 2px}
  #agentsGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
  #agentsGrid .card{margin:0;padding:8px 10px;font-size:12px}
  #eventFeed{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;line-height:1.7;color:#b7c1ff;direction:ltr;text-align:left;max-height:30vh;overflow:auto;background:#070a16;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  #banner{position:fixed;top:0;inset-inline:0;z-index:50;background:rgba(251,191,36,.95);color:#1a1200;font-size:12px;font-weight:700;padding:8px 14px;text-align:center;display:none}
</style>
</head>
<body>
<div id="banner"></div>
<header>
  <h1>RABIT</h1>
  <span class="badge dim" id="connBadge">…</span>
  <span class="badge dim" id="workerBadge">WORKER</span>
  <span class="badge dim" id="adapterBadge" hidden>MOCK</span>
  <div class="spacer"></div>
  <span class="badge dim" id="micBadge">MIC OFF</span>
  <button class="sbtn" id="langBtn" style="padding:6px 10px;font-size:11px">EN</button>
</header>

<div id="stage">
  <canvas id="orb"></canvas>
  <span id="micDot"></span>
  <div id="centerText">
    <span id="voiceState">INITIALIZING</span>
    <div id="transcriptLine"></div>
    <div id="replyLine"></div>
    <div id="execLine"></div>
  </div>
</div>

<div id="controls">
  <button class="cbtn" id="muteBtn" title="hard mute">🔇</button>
  <button class="cbtn" id="chatBtn" title="chat">💬</button>
  <button class="cbtn" id="talkBtn" title="talk">🎙️</button>
  <button class="cbtn" id="activityBtn" title="activity">📋</button>
  <button class="cbtn" id="approvalsBtn" title="approvals">✋<span class="cnt" id="apprCnt" hidden>0</span></button>
</div>

<div class="ov" id="chatOv"></div>
<div class="drawer" id="chatDrawer">
  <div class="grab"></div>
  <div id="chatMsgs"></div>
  <div id="chatRow">
    <input id="chatInp" placeholder="اكتب لرابِت…" autocomplete="off">
    <button class="sbtn primary" id="chatSend">➤</button>
  </div>
</div>

<div class="ov" id="actOv"></div>
<div class="drawer" id="actDrawer">
  <div class="grab"></div>
  <h2 id="hPlans">PLANS AWAITING YOUR CONFIRMATION</h2><div id="secPlans"></div>
  <h2>RUNNING NOW</h2><div id="secRunning"></div>
  <h2>APPROVALS</h2><div id="secApprovals"></div>
  <h2>WAITING</h2><div id="secWaiting"></div>
  <h2>RECENTLY COMPLETED</h2><div id="secDone"></div>
  <h2>FAILED / BLOCKED</h2><div id="secFailed"></div>
  <h2>AGENTS</h2><div id="agentsGrid"></div>
  <h2>SYSTEM HEALTH</h2><div id="secHealth"></div>
  <h2>EVENT FEED (persisted)</h2><div id="eventFeed"></div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
